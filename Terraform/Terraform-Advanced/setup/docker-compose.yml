
name: localstack-lab

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    restart: unless-stopped

    ports:
      - "127.0.0.1:4566:4566"

    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=eu-north-1
      - PERSISTENCE=1
      - DEBUG=0

    volumes:
      - ./data:/var/lib/localstack

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:4566/_localstack/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
