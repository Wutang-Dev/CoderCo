services:
  web:
    build: ./Flask
    expose:
      - "5001"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  
  nginx:
    image: nginx:latest
    ports:
    - "5001:5001"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
    - web

  redis:
    build: ./Redis
    volumes:
      - redis_data:/data
volumes:
  redis_data: